name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "lts"
          cache: true
          run-install: true

      - name: Check
        run: vp check

      - name: Test
        run: vp test

      - name: Build
        if: github.event_name == 'pull_request'
        run: vp build

  deploy:
    name: cd
    runs-on: ubuntu-26.04

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: https://tanstack-starter.shohaul143.workers.dev

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "lts"
          cache: true
          run-install: true

      - name: Deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
