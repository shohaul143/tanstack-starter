version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    commit-message:
      prefix: "chore(deps)"

    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      major:
        patterns:
          - "*"
        update-types:
          - major

    # Node types must match the runtime pinned in .node-version.
    # Bump this by hand when you move to a new Node major.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    commit-message:
      prefix: "ci(deps)"

    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

      major:
        patterns:
          - "*"
        update-types:
          - major
